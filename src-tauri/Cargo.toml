[package]
name = "annota"
version = "0.1.0"
description = "Annota: annotated screenshots to paste into agent chats"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Pinned exactly: the `--snap` fast path in `single_instance.rs` reuses its private window names
# and payload, so an upgrade must be a deliberate change (the test there pins them).
tauri-plugin-single-instance = "=2.5.4"
# `next_snap` parks on a oneshot until the Overlay hands over a Region. Already in the tree via tauri.
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# Already in the tree via wry; used to lower the hidden Editor's memory target.
webview2-com = "0.39"
windows-core = "0.62"
# The fast path, the Local\ mutex and the elevation trap. Already in the tree via webview2-com.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The clipboard: `set_image` writes the "PNG" and CF_DIBV5 formats (spec 9).
arboard = "3.6"
# Autostart's registry reads and writes (already in the tree via tauri).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
