<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annota</title>
    <style>
      :root {
        /* Rust places the window around this (`HINT_CSS_HEIGHT` in editor.rs). */
        --hint-height: 28px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2a2a2f;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        font: 12px "Segoe UI", system-ui, sans-serif;
      }
      /* The canvas fills the stage and never sizes it: the page redraws from the stage's device pixels. */
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #hint {
        flex: none;
        height: var(--hint-height);
        line-height: var(--hint-height);
        text-align: center;
        color: #a8a8b3;
        letter-spacing: 0.01em;
        user-select: none;
      }
      #hint b {
        color: #dcdce2;
        font-weight: 600;
      }
      /* The Note field (spec 7.1, variant A): a white card under its Box. */
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .note-card {
        position: absolute;
        box-sizing: border-box;
        background: #fff;
        color: #16161a;
        border: 1px solid #d1d1d8;
        border-radius: 8px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.28);
        padding: 8px 10px 6px;
      }
      .note-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 600;
        color: #55555f;
      }
      .note-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-width: 14px;
        height: 14px;
        padding: 0 3px;
        border-radius: 7px;
        background: #e5484d;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
      }
      .note-text {
        display: block;
        box-sizing: border-box;
        width: 100%;
        max-height: 40vh;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        resize: none;
        overflow: auto;
        background: transparent;
        color: #16161a;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      .note-foot {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 4px;
        font-size: 11px;
        color: #8a8a94;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="snap"></canvas><div id="overlay"></div></div>
    <div id="hint"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
